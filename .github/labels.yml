# Source of truth for this repo's labels.
# Synced to GitHub by .github/workflows/labels.yml (prune: true — labels not listed here are removed).

# ── Type ──────────────────────────────────────────────
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or improvement request
- name: question
  color: d876e3
  description: A question rather than a bug or request
- name: documentation
  color: 0075ca
  description: Help text, guides, or wording

# ── Triage & workflow ─────────────────────────────────
- name: triage
  color: ededed
  description: Awaiting first review by the team
- name: needs-info
  color: fbca04
  description: Waiting on more details from the reporter
- name: confirmed
  color: 0e8a16
  description: Reproduced / accepted
- name: wontfix
  color: ffffff
  description: This will not be worked on
- name: duplicate
  color: cfd3d7
  description: Already tracked elsewhere
- name: invalid
  color: e4e669
  description: Not a valid report
- name: good first report
  color: 7057ff
  description: A clear, well-scoped example of a helpful report

