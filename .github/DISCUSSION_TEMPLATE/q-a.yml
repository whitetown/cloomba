title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Got a question about using Cloomba? Ask away 💬 — please search existing discussions first.

        ⚠️ If something is broken, open a [bug report](https://github.com/whitetown/cloomba/issues/new?template=bug.yml) instead. For security or privacy, [report it privately](https://github.com/whitetown/cloomba/security/advisories/new).
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
  - type: dropdown
    id: platform
    attributes:
      label: Where?
      options:
        - Web (cloomba.com)
        - iOS app
        - Android app
        - Not sure
